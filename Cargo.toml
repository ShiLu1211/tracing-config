[package]
name = "tracing-declarative"
version = "1.0.0"
edition = "2021"
description = "Declarative tracing initialization via tracing.toml — logback/log4j patterns, multi-appender, OpenTelemetry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/qqqqc/tracing-declarative"
documentation = "https://docs.rs/tracing-declarative"
readme = "README.md"
keywords = ["tracing", "logging", "logback", "toml", "declarative"]
categories = ["development-tools::debugging"]
rust-version = "1.75"

[features]
default = []
hot-reload = ["dep:notify"]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
once_cell = "1"
thiserror = "2"
notify = { version = "8", features = ["macos_kqueue"], optional = true }
parking_lot = "0.12"
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "formatter"
harness = false
