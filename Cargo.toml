[package]
name = "tracing-config"
version = "0.1.0"
edition = "2021"

[features]
default = ["hot-reload"]
hot-reload = ["dep:notify"]

[dependencies]
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
once_cell = "1"
thiserror = "2"
notify = { version = "8", features = ["macos_kqueue"], optional = true }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"
