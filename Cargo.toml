[package]
name = "tracing-config"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
chrono = { version = "0.4", features = ["clock"] }
regex = "1"
once_cell = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
